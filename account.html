<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account - K-Card Market</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header id="siteHeader"></header>

    <section id="acctNeedsAuth" class="panel card section-gap" hidden>
      <h2>Sign in required</h2>
      <p class="small card-intro">Please sign in to edit your account.</p>
      <a class="btn primary" href="login.html">Go to Login</a>
    </section>

    <section id="acctAuthed" class="two-col" hidden>
      <div class="panel card">
        <h2>Your profile</h2>
        <p class="small card-intro">This saves locally for the MVP and pre-fills new listings.</p>

        <form class="form" id="accountForm">
          <input id="ac_display_name" class="input" placeholder="Display name" />

          <div class="row">
            <input id="ac_location" class="input" placeholder="Location (e.g., NJ, USA)" />
            <label class="toggle" title="Show as a seller">
              <input type="checkbox" id="ac_is_seller" checked />
              Seller account
            </label>
          </div>

          <input id="ac_bio" class="input" placeholder="Short bio (optional)" />

          <h3 class="form-heading">Seller defaults</h3>
          <p class="small card-intro">Shown to buyers on your listings.</p>

          <input id="ac_packaging" class="input" placeholder="Packaging notes (e.g., sleeve + toploader + team bag)" />

          <button class="btn primary" type="submit">Save profile</button>
          <div class="small" id="accountMsg"></div>
        </form>
      </div>

      <aside class="panel card">
        <h3 class="section-title">Account</h3>
        <div class="small" id="acctEmail">Signed in</div>
        <a class="btn full-width section-gap-sm" href="dashboard.html">Go to Sell dashboard</a>
      </aside>
    </section>

    <footer class="footer">&copy; <span data-current-year></span> K-Card Market</footer>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
