<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout - K-Card Market</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header id="siteHeader" class="panel nav">
      <a class="brand" href="index.html">
        <img class="logo" src="assets/brand-mark.png" alt="" aria-hidden="true" />
        <div class="brand-copy">
          <strong>K-Card Market</strong>
          <span>Photocard marketplace</span>
        </div>
      </a>

      <button class="hamburger" type="button" data-menu-toggle aria-label="Toggle navigation" aria-expanded="false">Menu</button>

      <nav class="navlinks" aria-label="Primary navigation">
        <a data-nav href="index.html">Home</a>
        <a data-nav href="browse.html">Browse</a>
        <a data-nav href="dashboard.html">Sell</a>
        <a data-nav href="account.html">Account</a>
      </nav>

      <div class="nav-cta">
        <button class="btn" type="button" data-theme-toggle aria-label="Switch color theme">Dark mode</button>
        <div id="authBtnSlot"><a class="btn" href="login.html">Login</a></div>
        <a class="btn primary" href="dashboard.html">List a card</a>
      </div>
    </header>

    <section class="page-head">
      <span class="eyebrow">Buy request</span>
      <h1>Request these cards</h1>
      <p>Send a local MVP purchase request to the seller.</p>
    </section>

    <section class="two-col">
      <div class="panel card">
        <h2>Buyer info</h2>
        <p class="small flush">This creates a local request sellers can review in the dashboard.</p>

        <form class="form" id="checkoutForm">
          <input id="name" class="input" placeholder="Full name" required />
          <input id="email" class="input" placeholder="Email" type="email" required />
          <input id="address1" class="input" placeholder="Address line 1" required />
          <input id="address2" class="input" placeholder="Address line 2 (optional)" />
          <div class="row">
            <input id="city" class="input" placeholder="City" required />
            <input id="state" class="input" placeholder="State" required />
          </div>
          <div class="row">
            <input id="zip" class="input" placeholder="ZIP" required />
            <input id="country" class="input" placeholder="Country" value="USA" required />
          </div>
          <textarea id="buyerMessage" class="input textarea" placeholder="Message to seller (optional)"></textarea>
          <button class="btn primary" type="submit">Send buy request</button>
        </form>
      </div>

      <aside class="panel card">
        <div id="checkoutSummary"></div>
      </aside>
    </section>

    <footer class="footer">&copy; <span data-current-year></span> K-Card Market</footer>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
