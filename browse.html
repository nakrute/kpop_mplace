<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browse - K-Card Market</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header id="siteHeader" class="panel nav">
      <a class="brand" href="index.html">
        <img class="logo" src="assets/brand-mark.png" alt="" aria-hidden="true" />
        <div class="brand-copy">
          <strong>K-Card Market</strong>
          <span>Photocard marketplace</span>
        </div>
      </a>

      <button class="hamburger" type="button" data-menu-toggle aria-label="Toggle navigation" aria-expanded="false">Menu</button>

      <nav class="navlinks" aria-label="Primary navigation">
        <a data-nav href="index.html">Home</a>
        <a data-nav href="browse.html">Browse</a>
        <a data-nav href="dashboard.html">Sell</a>
        <a data-nav href="account.html">Account</a>
      </nav>

      <div class="nav-cta">
        <button class="btn" type="button" data-theme-toggle aria-label="Switch color theme">Dark mode</button>
        <div id="authBtnSlot"><a class="btn" href="login.html">Login</a></div>
        <a class="btn primary" href="dashboard.html">List a card</a>
      </div>
    </header>

    <section class="page-head">
      <span class="eyebrow">Marketplace</span>
      <h1>Browse photocards</h1>
      <p>Search active listings by group, member, card title, album, or notes.</p>
    </section>

    <section class="panel toolbar">
      <div class="filters">
        <input id="searchInput" class="input" placeholder="Search group, member, or card..." aria-label="Search listings" />
        <input id="maxPriceFilter" class="input" type="number" min="0" step="0.01" placeholder="Max price" aria-label="Maximum price" />

        <select id="sortFilter" aria-label="Sort">
          <option value="">Sort by</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
        </select>

        <button id="clearFiltersBtn" class="btn" type="button">Clear</button>
      </div>

      <div id="resultsCount" class="small">Showing 0 listings</div>
    </section>

    <section id="noResults" class="panel card section-gap-sm" hidden>
      <h3>No matches</h3>
      <p class="small flush">Try clearing filters or searching a broader term.</p>
    </section>

    <section id="browseList" class="list"></section>

    <footer class="footer">&copy; <span data-current-year></span> K-Card Market</footer>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
