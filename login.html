<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - K-Card Market</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header id="siteHeader"></header>

    <section class="two-col">
      <div class="panel card">
        <h2>Sign in</h2>
        <p class="small card-intro">
          Use the email and password you created for this MVP demo.
        </p>

        <div class="oauth-section" aria-label="Social sign in">
          <button class="btn google-btn full-width" id="googleLoginBtn" type="button">
            <span class="google-mark" aria-hidden="true">G</span>
            Continue with Google
          </button>
        </div>

        <div class="auth-divider"><span>or</span></div>

        <form class="form" id="loginForm">
          <input class="input" id="li_email" placeholder="Email" type="email" required />
          <input class="input" id="li_password" placeholder="Password" type="password" required />
          <button class="btn primary" type="submit">Sign in</button>
          <div class="small" id="loginMsg"></div>
        </form>
      </div>

      <aside class="panel card">
        <h2>Create account</h2>
        <p class="small card-intro">
          Create a seller/buyer account. For now, accounts are saved in this browser.
        </p>

        <form class="form" id="signupForm">
          <input class="input" id="su_display_name" placeholder="Display name" required />
          <input class="input" id="su_email" placeholder="Email" type="email" required />
          <input class="input" id="su_password" placeholder="Password (min 6 chars)" type="password" required />
          <button class="btn primary" type="submit">Create account</button>
          <div class="small" id="signupMsg"></div>
        </form>
      </aside>
    </section>

    <footer class="footer">&copy; <span data-current-year></span> K-Card Market</footer>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
