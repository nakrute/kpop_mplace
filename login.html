<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - K-Card Market</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header id="siteHeader" class="panel nav">
      <a class="brand" href="index.html">
        <img class="logo" src="assets/brand-mark.png" alt="" aria-hidden="true" />
        <div class="brand-copy">
          <strong>K-Card Market</strong>
          <span>Photocard marketplace</span>
        </div>
      </a>

      <button class="hamburger" type="button" data-menu-toggle aria-label="Toggle navigation" aria-expanded="false">Menu</button>

      <nav class="navlinks" aria-label="Primary navigation">
        <a data-nav href="index.html">Home</a>
        <a data-nav href="browse.html">Browse</a>
        <a data-nav href="dashboard.html">Sell</a>
        <a data-nav href="account.html">Account</a>
      </nav>

      <div class="nav-cta">
        <button class="btn" type="button" data-theme-toggle aria-label="Switch color theme">Dark mode</button>
        <div id="authBtnSlot"><a class="btn" href="login.html">Login</a></div>
        <a class="btn primary" href="dashboard.html">List a card</a>
      </div>
    </header>

    <section class="two-col">
      <div class="panel card">
        <h2>Sign in</h2>
        <p class="small card-intro">
          Use the email and password you created for this MVP demo.
        </p>

        <form class="form" id="loginForm">
          <input class="input" id="li_email" placeholder="Email" type="email" required />
          <input class="input" id="li_password" placeholder="Password" type="password" required />
          <button class="btn primary" type="submit">Sign in</button>
          <div class="small" id="loginMsg"></div>
        </form>
      </div>

      <aside class="panel card">
        <h2>Create account</h2>
        <p class="small card-intro">
          Create a seller/buyer account. Passwords are hashed and your session is stored in a secure HTTP-only cookie.
        </p>

        <form class="form" id="signupForm">
          <input class="input" id="su_display_name" placeholder="Display name" required />
          <input class="input" id="su_email" placeholder="Email" type="email" required />
          <input class="input" id="su_password" placeholder="Password (min 8 chars)" type="password" minlength="8" required />
          <button class="btn primary" type="submit">Create account</button>
          <div class="small" id="signupMsg"></div>
        </form>
      </aside>
    </section>

    <footer class="footer">&copy; <span data-current-year></span> K-Card Market</footer>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
